<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1p Challenge Automator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">
  <header>
    <div class="title"><span class="penny">1p</span> Challenge Automator</div>
    <button class="icon-btn" id="infoBtn" title="About">ⓘ</button>
    <div class="tabs">
      <button class="tab-btn active" id="tabProgress">📊 PROGRESS</button>
      <button class="tab-btn" id="tabSettings">⚙️ SETTINGS</button>
    </div>
    <div class="day-badge">Day <b id="dayNum">--</b></div>
  </header>

  <main>
    <div class="content">

      <!-- PROGRESS VIEW -->
      <div class="progress-view" id="progressView">
        <p class="quote" id="quoteText">"..."</p>

        <div class="stat-row">
          <div class="stat-label">Today's transfer</div>
          <div class="stat-value">£<span id="todayTransfer">0.00</span></div>
          <div class="status-line" id="statusLine"></div>
        </div>

        <div class="stat-row">
          <div class="stat-label">Saved so far</div>
          <div class="saved-values">
            £<span id="savedSoFar">0.00</span> <span class="goal">/ £<span id="goalAmount">0.00</span></span>
          </div>

          <div id="barView">
            <div class="progress-track" id="progressTrack"></div>
            <div class="progress-meta">
              <span id="progressPct">0%</span>
              <span id="remaining"></span>
            </div>
          </div>

          <div id="lineView" class="line-graph" style="display:none;">
            <svg id="lineSvg" viewBox="0 0 400 120" width="100%" height="120" preserveAspectRatio="none"></svg>
          </div>
        </div>

        <div class="chart-toggle">
          <label id="labelBar"><input type="radio" name="chartView" value="progress_bar"> Progress bar</label>
          <label id="labelLine"><input type="radio" name="chartView" value="line_graph"> Line graph</label>
        </div>
      </div>

      <!-- SETTINGS VIEW -->
      <div class="settings-form" id="settingsView">
        <div class="field">
          <label for="emailInput">Notification email</label>
          <input type="email" id="emailInput" placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="timeInput">Daily transfer time</label>
          <input type="time" id="timeInput">
        </div>
        <div class="field toggle-row">
          <input type="checkbox" id="progressEmailToggle">
          <label for="progressEmailToggle" style="margin:0;">Send weekly progress emails</label>
        </div>
        <button class="save-btn" id="saveSettingsBtn">Save changes</button>
      </div>

    </div>

    <aside class="sidebar">
      <h2>⚙️ Quick settings</h2>
      <button class="qs-btn" id="qsChangeEmail">✉️ Change email</button>
      <button class="qs-btn" id="qsSendProgress">📤 Send progress email</button>
      <button class="qs-btn" id="qsChangeTime">🕐 Change transfer time</button>
    </aside>
  </main>
</div>

<div class="confirm-toast" id="toast">Saved</div>

<script src="data-store.js"></script>
<script src="app.js"></script>
</body>
</html>
